<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Ghost Challenge — Commerce Gyan</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Multi-color Confetti Burst SDK -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="app-container" style="padding-bottom: 80px;">

    <!-- Top Status Bar -->
    <header class="header-bar">
      <button class="btn-back" onclick="window.location.href='index.html'">← Home</button>
      <div style="font-weight: 700; font-size: 0.9rem;" id="qProgressHeader">Question 1 of 5</div>
      <div class="pill pill-gold" id="liveCoinsPill">🪙 <span class="mono" id="currentCoins">0</span></div>
    </header>

    <!-- Subject Row -->
    <div class="pills-row" style="display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px;">
      <button class="pill pill-subject subject-pill active" data-subject="Accountancy" id="subj-acc" onclick="selectPracticeSubject('Accountancy')">📘 ACCOUNTANCY</button>
      <button class="pill pill-subject subject-pill" data-subject="Business Studies" id="subj-bst" onclick="selectPracticeSubject('Business Studies')">📙 BUSINESS STUDIES</button>
      <button class="pill pill-subject subject-pill" data-subject="Economics" id="subj-eco" onclick="selectPracticeSubject('Economics')">📗 ECONOMICS</button>
    </div>

    <!-- Difficulty Row -->
    <div class="pills-row" style="display: flex; gap: 6px; margin-bottom: 14px;">
      <button class="pill pill-diff diff-pill active" data-difficulty="STANDARD" id="diff-standard" onclick="selectPracticeDifficulty('STANDARD')">⭐ STANDARD</button>
      <button class="pill pill-diff diff-pill" data-difficulty="MODERATE" id="diff-moderate" onclick="selectPracticeDifficulty('MODERATE')">⚡ MODERATE</button>
      <button class="pill pill-diff diff-pill" data-difficulty="HOTS TRAP" id="diff-hots" onclick="selectPracticeDifficulty('HOTS TRAP')">🔥 HOTS TRAP</button>
    </div>

    <!-- Ghost Timer Speed Challenge Aura -->
    <div class="ghost-timer-wrap pulse-gold" id="ghostTimerCard">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 1.3rem;">⏱️</span>
        <div>
          <div style="font-size: 0.72rem; color: var(--heritage-gold); font-weight: 700;">GYAN SIR'S LIVE RECORD</div>
          <div class="mono" style="font-size: 0.88rem; font-weight: 700;" id="ghostTargetSec">35 Seconds</div>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="text-xs text-secondary">YOUR TIME</div>
        <div class="mono" style="font-size: 1.2rem; font-weight: 700; color: #F8FAFC;" id="liveStopwatch">0s</div>
      </div>
    </div>

    <!-- Question Card Container -->
    <div id="questionCardContainer" class="question-card">
      <div class="card" id="questionCard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <span class="pill pill-violet" id="qTopicPill">Partnership Accounts</span>
          <button class="btn btn-outline btn-sm" id="btnSharkTank" style="display: none;">🦈 Shark Tank Hint</button>
        </div>

        <h2 id="qText" style="font-size: 1.05rem; line-height: 1.5; margin-bottom: 20px; font-weight: 600;">
          Loading question...
        </h2>

        <!-- Options Container -->
        <div id="optionsContainer">
          <!-- Injected dynamically via question.js -->
        </div>
      </div>
    </div>

    <!-- Explanation & Feedback Drawer (Hidden until answered) -->
    <div class="card card-violet" id="feedbackCard" style="display: none;">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
        <span id="feedbackIcon" style="font-size: 1.4rem;">✅</span>
        <h3 id="feedbackTitle" style="font-size: 1.05rem;">Correct Answer!</h3>
      </div>
      <div class="text-sm serif" id="feedbackExplanation" style="line-height: 1.6; color: #E2E8F0; margin-bottom: 14px;">
        Explanation goes here...
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-outline" id="btnSaveNote" style="flex: 1;">📓 Save Note</button>
        <button class="btn btn-primary" id="btnNextQuestion" style="flex: 1.5;">Next Question ➡️</button>
      </div>
    </div>

  </div>

  <!-- Shark Tank Pop-Culture Modal Drawer -->
  <div class="modal-overlay" id="sharkTankModal">
    <div class="modal-drawer">
      <div class="drawer-pill"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span class="pill pill-gold">🦈 SHARK TANK DE-CODER</span>
        <button onclick="closeSharkModal()" style="background: none; border: none; color: #94A3B8; font-size: 1.2rem;">✕</button>
      </div>
      <h3 style="margin-bottom: 8px;" id="sharkModalTitle">Real-World Business Analogy</h3>
      <p class="text-sm serif" style="line-height: 1.6; color: #CBD5E1;" id="sharkModalText">
        Shark tank explanation...
      </p>
      <button class="btn btn-gold" style="margin-top: 18px;" onclick="closeSharkModal()">Got It! Back to MCQ</button>
    </div>
  </div>

  <!-- 5-Tab Bottom Navigation Bar (Claude Audit Spec) -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="question.html" class="nav-item active">
      <span class="nav-icon">⚡</span>
      <span>Practice</span>
    </a>
    <a href="redpen.html?v=3.2.0" class="nav-item nav-center-highlight">
      <span class="nav-icon">✍️</span>
      <span>Check</span>
    </a>
    <a href="notebook.html" class="nav-item">
      <span class="nav-icon">📓</span>
      <span>Mistakes</span>
    </a>
    <a href="fee.html?v=2.5.0" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Me</span>
    </a>
  </nav>

  <script src="js/telegram.js"></script>
  <script src="js/api.js"></script>
  <script src="js/question.js"></script>
</body>
</html>
