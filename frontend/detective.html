<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Case Study Lab — Commerce Gyan</title>
  <!-- Telegram WebApp SDK & Confetti -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css?v=3.2.5">
  <link rel="stylesheet" href="css/animations.css?v=3.2.5">
  <link rel="stylesheet" href="css/auth-failed.css">
  <style>
    .subject-pill-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .subject-pill-bar::-webkit-scrollbar { display: none; }
    .sub-filter-btn {
      flex: 1;
      white-space: nowrap;
      text-align: center;
      padding: 9px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #151922;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sub-filter-btn.active {
      background: linear-gradient(135deg, #2D124D 0%, #4C1D95 100%);
      border-color: #D4AF37;
      color: #F8FAFC;
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.25);
    }
    .case-scenario-box {
      background: #11141D;
      border-left: 3px solid #D4AF37;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #E2E8F0;
      margin-bottom: 14px;
    }
    .case-question-card {
      background: #151922;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .marking-scheme-card {
      background: linear-gradient(180deg, #181E29 0%, #11141D 100%);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .scheme-step {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .scheme-step-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body class="redpen-page">
  <div class="app-container">

    <!-- Top Header -->
    <header class="header-bar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="btn-back" onclick="window.location.href='index.html'">← Home</button>
        <div>
          <div class="text-xs text-secondary" style="font-weight: 700; letter-spacing: 0.5px;">CBSE COMPETENCY PRACTICE</div>
          <h2 style="font-size: 1.15rem;">📋 Case Study Lab</h2>
        </div>
      </div>
      <div class="pill pill-gold" id="coinPill">CBSE Marking Scheme</div>
    </header>

    <!-- 3 Subject Filter Pills -->
    <div class="subject-pill-bar">
      <button class="sub-filter-btn active" data-subject="BST" id="btnFilterBST">
        📙 Business Studies
      </button>
      <button class="sub-filter-btn" data-subject="ACC" id="btnFilterACC">
        📘 Accountancy
      </button>
      <button class="sub-filter-btn" data-subject="ECON" id="btnFilterECON">
        📗 Economics
      </button>
    </div>

    <!-- Active Case Container -->
    <div id="caseStudyContainer">
      <!-- Injected dynamically by detective.js -->
    </div>

    <!-- Official CBSE Marking Scheme Drawer (Hidden until revealed) -->
    <div id="markingSchemeContainer" style="display: none;">
      <!-- Injected dynamically by detective.js -->
    </div>

  </div>

  <!-- Bottom Navigation -->
  <!-- 5-Tab Bottom Navigation Bar (Claude Audit Spec) -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="question.html" class="nav-item">
      <span class="nav-icon">⚡</span>
      <span>Practice</span>
    </a>
    <a href="redpen.html?v=3.2.0" class="nav-item nav-center-highlight">
      <span class="nav-icon">✍️</span>
      <span>Check</span>
    </a>
    <a href="notebook.html" class="nav-item">
      <span class="nav-icon">📓</span>
      <span>Mistakes</span>
    </a>
    <a href="fee.html?v=2.5.0" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Me</span>
    </a>
  </nav>

  <script src="js/telegram.js?v=3.2.5"></script>
  <script src="js/api.js?v=3.2.5"></script>
  <script src="js/detective.js?v=3.2.5"></script>
</body>
</html>
