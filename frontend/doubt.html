<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voice Doubt Solver — Commerce Gyan</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="app-container" style="display: flex; flex-direction: column; height: 100vh; padding-bottom: 125px;">

    <header class="header-bar" style="margin-bottom: 4px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="btn-back" onclick="window.location.href='index.html'">← Home</button>
        <div>
          <div class="text-xs text-secondary">24/7 AI STUDY BUDDY</div>
          <h2 style="font-size: 1.15rem;">🎤 Voice Doubt Solver</h2>
        </div>
      </div>
      <div class="pill pill-gold">24/7 AI Mentor</div>
    </header>

    <!-- Suggested Question Chips -->
    <div style="display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 10px; margin-bottom: 8px;">
      <button class="pill pill-violet" onclick="askPreset('Why is Interest on Partner Loan a Charge and not an Appropriation?')">Loan Interest?</button>
      <button class="pill pill-violet" onclick="askPreset('Explain Unity of Command vs Unity of Direction in Business Studies')">Unity of Command?</button>
      <button class="pill pill-violet" onclick="askPreset('Explain Price Elasticity of Demand with real example')">Elasticity?</button>
    </div>

    <!-- Chat Message Container -->
    <div id="chatMessages" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px;">
      <!-- Welcome message -->
      <div class="card card-violet" style="margin: 0;">
        <div style="font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; color: #A5B4FC;">🎧 AI Study Mentor</div>
        <p class="serif text-sm" style="line-height: 1.5; color: #E2E8F0;">
          Hello! I am your 24/7 Commerce Mentor. Ask or speak any doubt in Accountancy, Business Studies, or Economics, and I'll break it down with clear, simple explanations and real-world examples!
        </p>
      </div>
    </div>

    <!-- Voice Waveform Live Visualizer (Hidden until mic is active) -->
    <div id="liveWaveform" class="waveform-container" style="display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px 0; margin-bottom: 8px;">
      <div style="display: flex; gap: 6px; align-items: center;">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div id="recordingStatusText" style="font-size: 0.82rem; color: #F87171; font-weight: 600; letter-spacing: 0.3px;">Listening to your doubt...</div>
    </div>

    <!-- Bottom Input Bar -->
    <div style="position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--bg-dark); border-top: 1px solid var(--border-dark); padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 200;">
      <!-- Voice Mic Button -->
      <div style="display: flex; justify-content: center; align-items: center;">
        <button id="btnVoiceRecord" class="btn-voice-record" type="button">
          <span id="micIcon" style="font-size: 1.1rem;">🎤</span>
          <span id="micLabel">Tap to Speak</span>
        </button>
      </div>

      <!-- Text Input & Send -->
      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="text" id="doubtInput" placeholder="Or type your doubt or question..." style="flex: 1; height: 42px; background: var(--bg-surface-dark); border: 1px solid var(--border-dark); border-radius: var(--radius-md); padding: 0 14px; color: #FFF; font-size: 0.9rem; outline: none;">
        <button id="btnSendDoubt" class="btn btn-primary btn-sm" style="height: 42px; padding: 0 16px; width: auto;">
          Send
        </button>
      </div>
    </div>

  </div>

  <script src="js/telegram.js"></script>
  <script src="js/api.js"></script>
  <script src="js/doubt.js"></script>
</body>
</html>
