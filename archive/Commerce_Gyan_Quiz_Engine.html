<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commerce Gyan Quiz Engine</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4}
.container{max-width:1000px;margin:auto;padding:20px}
.card{background:white;padding:25px;border-radius:12px}
.timer{font-size:48px;font-weight:bold;text-align:center}
.meta{display:flex;justify-content:space-between;margin:10px 0}
.question{font-size:28px;margin:20px 0}
.option{padding:15px;border:1px solid #ccc;border-radius:8px;margin:10px 0}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>Commerce Gyan MCQ Quiz Engine</h1>
<div class="meta">
<div id="difficulty"></div>
<div id="progress"></div>
</div>
<div class="timer" id="timer"></div>
<div class="question" id="question"></div>
<div id="options"></div>
</div>
</div>

<script>
const questions = [
{
difficulty:"Easy",
time:30,
question:"Sample Question 1",
options:["A","B","C","D"]
},
{
difficulty:"Medium",
time:60,
question:"Sample Question 2",
options:["A","B","C","D"]
}
];

let current=0;
let remaining=questions[0].time;

function loadQuestion(){
const q=questions[current];

document.getElementById("difficulty").innerText="Difficulty: "+q.difficulty;
document.getElementById("progress").innerText=`Question ${current+1}/${questions.length}`;
document.getElementById("question").innerText=q.question;

const box=document.getElementById("options");
box.innerHTML="";

q.options.forEach((opt,i)=>{
const div=document.createElement("div");
div.className="option";
div.innerText=String.fromCharCode(65+i)+") "+opt;
box.appendChild(div);
});

remaining=q.time;
}

function tick(){
document.getElementById("timer").innerText=remaining+"s";

if(remaining<=0){
current++;

if(current>=questions.length){
document.body.innerHTML="<h1 style='text-align:center;margin-top:100px'>Quiz Finished</h1>";
return;
}

loadQuestion();
}

remaining--;
}

loadQuestion();
setInterval(tick,1000);
</script>
</body>
</html>
