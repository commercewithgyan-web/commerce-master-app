<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commerce Gyan Quiz Engine V8</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;overflow:hidden}
.header{height:80px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;background:#111827}
.brand{font-size:34px;font-weight:bold}
.container{width:1920px;max-width:100vw;height:calc(100vh - 80px);padding:20px;box-sizing:border-box}
.card{background:#fff;color:#111;border-radius:25px;height:100%;padding:30px;display:flex;flex-direction:column}
.toprow{display:flex;justify-content:space-between;align-items:center}
.badge{padding:10px 18px;border-radius:999px;font-size:24px;font-weight:bold}
.easy{background:#16a34a}.medium{background:#eab308;color:#000}.hard{background:#f97316}.expert{background:#dc2626}
.timer{font-size:32px;font-weight:bold}
.question{font-size:54px;font-weight:700;line-height:1.3;margin:40px 0;min-height:180px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.opt{padding:25px;border-radius:18px;color:white;font-size:40px;font-weight:bold}
.a{background:#2563eb}.b{background:#16a34a}.c{background:#ea580c}.d{background:#9333ea}
.footer{margin-top:auto}
.progress{height:18px;background:#ddd;border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:#38bdf8}
.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:24px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;font-size:200px;font-weight:bold;color:#fff}
.answer{position:fixed;inset:0;background:rgba(0,100,0,.95);display:none;align-items:center;justify-content:center;font-size:100px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<div class="brand">Commerce Gyan MCQ Challenge</div>
<div>Space=Pause | N=Next | R=Reveal | F=Fullscreen</div>
</div>

<div class="container">
<div class="card">
<div class="toprow">
<div id="badge" class="badge medium">Medium</div>
<div class="timer">⏱ <span id="timer">0</span></div>
</div>

<div id="question" class="question">Import CSV and Start Quiz</div>

<div class="options">
<div id="oa" class="opt a"></div>
<div id="ob" class="opt b"></div>
<div id="oc" class="opt c"></div>
<div id="od" class="opt d"></div>
</div>

<div class="footer">
<div class="progress"><div id="fill" class="fill"></div></div>
<div class="meta">
<div id="qinfo">Question 0/0</div>
<div id="cat">Category</div>
</div>
</div>
</div>
</div>

<div id="countdown" class="overlay"></div>
<div id="answer" class="answer"></div>

<script>
const questions=[];
let i=0,remain=0,max=0,pause=false,interval;

function loadSample(){
questions.push(
{q:"What is goodwill?",a:"Intangible Asset",b:"Liability",c:"Expense",d:"Income",ans:"A",difficulty:"Easy",category:"Goodwill"},
{q:"Investment fluctuation reserve is treated how?",a:"Asset",b:"Reserve",c:"Liability",d:"Expense",ans:"B",difficulty:"Hard",category:"Admission"}
);
start();
}

function timeFor(d){
d=d.toLowerCase();
if(d=="easy") return 30;
if(d=="medium") return 60;
if(d=="hard") return 120;
if(d=="expert") return 180;
return 60;
}

function showQ(){
const q=questions[i];
remain=timeFor(q.difficulty); max=remain;
badge.className='badge '+q.difficulty.toLowerCase();
badge.textContent=q.difficulty;
question.textContent=q.q;
oa.textContent='A) '+q.a;
ob.textContent='B) '+q.b;
oc.textContent='C) '+q.c;
od.textContent='D) '+q.d;
qinfo.textContent=`Question ${i+1}/${questions.length}`;
cat.textContent=q.category;
fill.style.width=((i/questions.length)*100)+'%';
}

function start(){
showQ();
clearInterval(interval);
interval=setInterval(()=>{
if(pause) return;
timer.textContent=remain;
if(remain<=0){ reveal(); }
remain--;
},1000);
}

function reveal(){
clearInterval(interval);
answer.style.display='flex';
answer.innerHTML='✅ Correct Answer: '+questions[i].ans;
setTimeout(()=>{
answer.style.display='none';
transition();
},5000);
}

function transition(){
let n=3;
countdown.style.display='flex';
countdown.textContent=n;
const t=setInterval(()=>{
n--;
if(n<=0){
clearInterval(t);
countdown.style.display='none';
nextQ();
}else countdown.textContent=n;
},1000);
}

function nextQ(){
i++;
if(i>=questions.length){
question.textContent='🏆 Quiz Completed';
return;
}
start();
}

document.addEventListener('keydown',e=>{
if(e.code==='Space') pause=!pause;
if(e.key==='n'||e.key==='N') nextQ();
if(e.key==='r'||e.key==='R') reveal();
if(e.key==='f'||e.key==='F') document.documentElement.requestFullscreen();
});

loadSample();
</script>
</body>
</html>
